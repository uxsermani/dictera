  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"865e3d04-20ba-4250-a870-9ffd7bd24115\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a7c149fb-1750-44da-87b7-abc63e75f0e3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"865e3d04-20ba-4250-a870-9ffd7bd24115\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a7c149fb-1750-44da-87b7-abc63e75f0e3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"865e3d04-20ba-4250-a870-9ffd7bd24115\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a7c149fb-1750-44da-87b7-abc63e75f0e3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --brand:#4318FF; --brand-soft:#868CFF; --brand-700:#2B3674;\n  --brand-100:#F2F4FF; --brand-150:#EAEBFF;\n  --grad:linear-gradient(135deg,#868CFF 0%,#4318FF 100%);\n\n  --ink:#1D1F23; --ink-2:#40444D; --mute:#7A7F89; --faint:#A2A8B4;\n  --canvas:#F4F7FE; --surface:#FFFFFF;\n  --line:#ECECF5; --line-2:#E0E5F2; --chip:#F2F4FF;\n\n  --ok:#159E5B; --ok-100:#EAF7F0;\n  --amber:#B0782B; --amber-100:#FAF3E8;\n  --slate:#5A6274; --slate-100:#F1F3F8;\n\n  --r:14px; --r-lg:18px; --r-xl:22px;\n  --sh-card:0 1px 2px rgba(33,30,61,.04), 0 12px 34px rgba(67,24,255,.06);\n  --sh-pop:0 18px 50px -22px rgba(67,24,255,.24);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{\n  font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--canvas);\n  -webkit-font-smoothing:antialiased;min-height:100vh;\n  background-image:\n    radial-gradient(900px 520px at 14% -8%, rgba(252,231,243,.7) 0%, rgba(252,231,243,0) 60%),\n    radial-gradient(900px 520px at 90% 2%, rgba(219,234,254,.7) 0%, rgba(219,234,254,0) 60%);\n}\na{color:var(--brand);text-decoration:none}\na:hover{color:var(--brand-700)}\n\n.wrap{max-width:1180px;margin:0 auto;padding:40px 32px 56px}\n.page-head{margin-bottom:8px}\n.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.6px}\n.page-head h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}\n.page-head p{font-size:14.5px;color:var(--mute);margin-top:6px;max-width:640px;line-height:1.5}\n\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}\n@media (max-width:860px){.grid{grid-template-columns:1fr}}\n\n/* ─── panel = mini chat composer ─── */\n.panel{\n  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);\n  box-shadow:var(--sh-card);overflow:hidden;display:flex;flex-direction:column;min-height:340px;\n}\n.panel-tag{\n  display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);\n  font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);\n}\n.panel-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}\n.panel-tag[data-tone=\"block\"] .dot{background:var(--brand)}\n.panel-tag[data-tone=\"ok\"] .dot{background:var(--ok)}\n.panel-tag[data-tone=\"warn\"] .dot{background:var(--amber)}\n.panel-tag[data-tone=\"ended\"] .dot{background:var(--slate)}\n\n.panel-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:14px}\n\n/* faint conversation ghost so the card reads as \"in-chat\" */\n.ghost{display:flex;gap:10px;opacity:.5}\n.ghost .orb{width:26px;height:26px;border-radius:8px;background:var(--grad);flex-shrink:0}\n.ghost .lines{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:4px}\n.ghost .lines span{height:7px;border-radius:4px;background:var(--line-2)}\n.ghost .lines span:nth-child(1){width:78%}\n.ghost .lines span:nth-child(2){width:54%}\n\n/* ─── redesigned notice card — animated gradient border ─── */\n@property --angle{syntax:'<angle>';inherits:false;initial-value:0deg}\n.notice{\n  position:relative;--glow:67,24,255;\n  border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);\n  box-shadow:0 1px 2px rgba(33,30,61,.04);\n  overflow:hidden;\n  transition:box-shadow .2s ease, border-color .2s ease;\n}\n.notice[data-tone=\"ok\"]{--glow:21,158,91}\n.notice[data-tone=\"warn\"]{--glow:176,120,43}\n.notice[data-tone=\"ended\"]{--glow:90,98,116}\n\n/* hover: quiet lift only */\n.notice:hover{\n  border-color:var(--line);\n  box-shadow:0 6px 20px -10px rgba(33,30,61,.16);\n}\n\n/* dismiss */\n.notice-close{\n  position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;border:none;\n  background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:.14s;z-index:2;\n}\n.notice-close:hover{background:var(--line);color:var(--ink-2)}\n.notice-close svg{width:14px;height:14px}\n.notice:has(.notice-close) .notice-main{padding-right:46px}\n.notice.dismissing{animation:cardOut .32s ease-in forwards}\n@keyframes cardOut{to{opacity:0;transform:translateY(-6px) scale(.985);height:0;margin-top:-14px;filter:blur(1px)}}\n.notice-main{display:flex;gap:14px;padding:16px 18px 15px}\n.notice-ic{\n  width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;\n  background:var(--brand-100);color:var(--brand);\n}\n.notice-ic svg{width:19px;height:19px}\n.notice[data-tone=\"ok\"] .notice-ic{background:var(--ok-100);color:var(--ok)}\n.notice[data-tone=\"warn\"] .notice-ic{background:var(--amber-100);color:var(--amber)}\n.notice[data-tone=\"ended\"] .notice-ic{background:var(--slate-100);color:var(--slate)}\n\n.notice-txt{min-width:0}\n.notice-txt h3{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}\n.notice-txt p{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:5px}\n.notice-txt p b{font-weight:600;color:var(--ink)}\n\n/* routing / meta line */\n.notice-meta{\n  display:flex;align-items:flex-start;gap:10px;padding:12px 18px;\n  border-top:1px solid var(--line);background:#FBFBFE;\n  font-size:12px;color:var(--mute);line-height:1.5;\n}\n[data-theme] .notice-meta b{font-weight:600;color:var(--ink-2)}\n.avatar{\n  width:26px;height:26px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;\n  font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3AA6B9,#127C8E);letter-spacing:.02em;\n}\n\n/* actions */\n.notice-act{padding:0 18px 16px;display:flex;align-items:center;gap:12px}\n.btn{\n  display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 20px;border-radius:12px;\n  font-size:13.5px;font-weight:600;border:none;cursor:pointer;transition:transform .12s,filter .15s,background .15s;\n}\n.btn svg{width:16px;height:16px}\n.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(67,24,255,.55)}\n.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.04)}\n.btn-ghost{background:transparent;color:var(--brand);padding:0;height:auto}\n.btn-ghost:hover{color:var(--brand-700)}\n.btn-ghost .arrow{transition:transform .15s}\n.btn-ghost:hover .arrow{transform:translateX(3px)}\n.act-note{font-size:12px;color:var(--faint)}\n\n/* ─── sticky chat input ─── */\n.composer-wrap{position:sticky;bottom:0;padding:14px 18px 18px;\n  background:linear-gradient(to top, var(--surface) 72%, rgba(255,255,255,0));border-top:1px solid var(--line)}\n.composer{\n  display:flex;align-items:center;gap:10px;background:var(--surface);\n  border:1px solid var(--line-2);border-radius:16px;padding:8px 8px 8px 16px;\n  box-shadow:var(--sh-pop);transition:border-color .15s;\n}\n.composer:focus-within{border-color:rgba(67,24,255,.5)}\n.composer input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink);font-family:inherit}\n.composer input::placeholder{color:var(--faint)}\n.composer input:disabled{cursor:not-allowed}\n.composer.locked{background:var(--chip);border-style:dashed}\n.mini-ic{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--brand);\n  display:grid;place-items:center;flex-shrink:0;cursor:pointer}\n.mini-ic:hover{background:var(--brand-100)}\n.mini-ic svg{width:17px;height:17px}\n.send{width:40px;height:40px;border-radius:50%;background:var(--grad);border:none;color:#fff;\n  display:grid;place-items:center;flex-shrink:0;cursor:pointer;box-shadow:0 6px 16px -6px rgba(67,24,255,.6);transition:transform .12s}\n.send:hover{transform:scale(1.06)}\n.send:disabled{background:var(--line-2);box-shadow:none;color:var(--faint);cursor:not-allowed;transform:none}\n.send svg{width:17px;height:17px}\n.lock-hint{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12px;color:var(--faint);margin-top:9px}\n.lock-hint svg{width:13px;height:13px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n  <div class=\"page-head\">\n    <h1>Usage &amp; entitlement <em>notices<\u002Fem><\u002Fh1>\n    <p>Four usage states, shown the way learners see them in the co-pilot — pinned just above the chat input, so it's always clear what's happening before you type.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"grid\">\n\n    <!-- 1 · ALL CREDITS USED (blocked) -->\n    <section class=\"panel\">\n      <div class=\"panel-tag\" data-tone=\"block\"><span class=\"dot\"><\u002Fspan> Generation paused<\u002Fdiv>\n      <div class=\"panel-body\">\n        <div class=\"ghost\"><div class=\"orb\"><\u002Fdiv><div class=\"lines\"><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"notice\" data-tone=\"block\">\n          <div class=\"notice-main\">\n            <div class=\"notice-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.4\"><\u002Frect><path d=\"M8 10.5V7a4 4 0 0 1 8 0v3.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"notice-txt\">\n              <h3>You're out of course credits<\u002Fh3>\n              <p>New course generation is paused for now. Everything you've already built stays <b>saved, fully viewable, and ready to export<\u002Fb> — nothing is lost. Adding credits picks up right where you left off.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"notice-meta\">\n            <span class=\"avatar\">PN<\u002Fspan>\n            <span>Credits are set by your institution. Your request goes to <b>Priya Nair · L&amp;D Procurement<\u002Fb>, who manages the budget.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"notice-act\">\n            <button class=\"btn btn-primary\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 8v6M23 11h-6M9 12a4 4 0 100-8 4 4 0 000 8zM2 21v-1a6 6 0 016-6h2a6 6 0 016 6v1\"><\u002Fpath><\u002Fsvg> Request more credits<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"composer-wrap\">\n        <div class=\"composer locked\">\n          <input placeholder=\"Paused until credits are added\" disabled=\"\">\n          <button class=\"send\" disabled=\"\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12l16-8-6 16-3-6z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"lock-hint\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2.4\"><\u002Frect><path d=\"M8 10.5V7a4 4 0 0 1 8 0v3.5\"><\u002Fpath><\u002Fsvg> Viewing &amp; export stay available<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 2 · REQUEST SENT (success) -->\n    <section class=\"panel\">\n      <div class=\"panel-tag\" data-tone=\"ok\"><span class=\"dot\"><\u002Fspan> Request sent<\u002Fdiv>\n      <div class=\"panel-body\">\n        <div class=\"ghost\"><div class=\"orb\"><\u002Fdiv><div class=\"lines\"><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"notice\" data-tone=\"ok\">\n          <button class=\"notice-close\" title=\"Dismiss\" aria-label=\"Dismiss\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div class=\"notice-main\">\n            <div class=\"notice-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"notice-txt\">\n              <h3>Your request is on its way<\u002Fh3>\n              <p>We've sent your credit request to <b>Priya Nair<\u002Fb> in L&amp;D Procurement. You'll get a notification the moment it's approved. Until then, your courses stay open and exportable.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"notice-meta\">\n            <span class=\"avatar\">PN<\u002Fspan>\n            <span>Sent 6 Jul to <b>Priya Nair · L&amp;D Procurement<\u002Fb>, who manages the budget.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"composer-wrap\">\n        <div class=\"composer\">\n          <input placeholder=\"Keep exploring your existing courses…\">\n          <button class=\"mini-ic\" title=\"Attach\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4M7 9l5-5 5 5M5 20h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button class=\"send\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12l16-8-6 16-3-6z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 3 · CREDITS RUNNING LOW (heads-up, non-blocking) -->\n    <section class=\"panel\">\n      <div class=\"panel-tag\" data-tone=\"warn\"><span class=\"dot\"><\u002Fspan> Heads-up<\u002Fdiv>\n      <div class=\"panel-body\">\n        <div class=\"ghost\"><div class=\"orb\"><\u002Fdiv><div class=\"lines\"><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"notice\" data-tone=\"warn\">\n          <button class=\"notice-close\" title=\"Dismiss\" aria-label=\"Dismiss\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div class=\"notice-main\">\n            <div class=\"notice-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"notice-txt\">\n              <h3>Credits are running low<\u002Fh3>\n              <p>About <b>2 course generations<\u002Fb> left on your institution's plan. No need to stop — keep building. When you're ready, give your admin a heads-up to top up.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"notice-act\">\n            <button class=\"btn btn-ghost\">Give admin a heads-up <span class=\"arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"composer-wrap\">\n        <div class=\"composer\">\n          <input placeholder=\"Describe your next course…\">\n          <button class=\"mini-ic\" title=\"Attach\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4M7 9l5-5 5 5M5 20h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button class=\"send\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-li
